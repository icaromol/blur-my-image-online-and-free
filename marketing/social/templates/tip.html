<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="brand.css" />
    <style>
      body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 7%;
      }
      .label {
        font-family: var(--font-mono);
        font-size: 22px;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      h1 {
        font-size: clamp(40px, 6.2vw, 76px);
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: -0.02em;
        max-width: 18ch;
      }
      p {
        margin-top: 24px;
        font-size: clamp(22px, 2.6vw, 32px);
        line-height: 1.35;
        color: var(--muted);
        max-width: 34ch;
      }
      footer {
        font-family: var(--font-mono);
        font-size: 22px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="label">{{label}}</div>
    <main>
      <h1>{{headline}}</h1>
      <p>{{body}}</p>
    </main>
    <footer>{{footer}}</footer>
  </body>
</html>
