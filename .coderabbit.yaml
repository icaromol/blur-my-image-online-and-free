language: en-US
reviews:
  profile: chill
  auto_review:
    enabled: true
    drafts: true
  path_filters:
    - "!pnpm-lock.yaml"
    - "!dist/**"
    - "!dist-server/**"
    - "!coverage/**"
  path_instructions:
    - path: "server/**"
      instructions: "Security review first: SSRF, redirects, size and timeout limits."
