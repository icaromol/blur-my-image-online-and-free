name: Bug report
description: Something does not work as the README says it should.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not attach images that show real people, documents or private data. Reproduce the problem with a public or synthetic image, or describe the image (format, dimensions, source).

        Security problems (URL proxy abuse, XSS, an image leaving the browser) go through the [private advisory form](https://github.com/icaromol/blur-my-image-online-and-free/security/advisories/new), not here.
  - type: dropdown
    id: step
    attributes:
      label: Which step is affected?
      options:
        - "Load an image"
        - "Blur it"
        - "Export it"
        - "Language or interface"
        - "None of these"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did and what you saw, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app and paste a PNG from the clipboard
        2. Choose Pixelate, intensity 60
        3. Paint with the brush, then press Ctrl+Z
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: image
    attributes:
      label: The image
      description: Format, pixel dimensions, file size, and how you loaded it (file, drop, paste, URL). For a URL load, say whether it worked with a direct request or needed the proxy if you can tell.
      placeholder: "JPEG, 6000x4000, 8 MB, loaded by URL"
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Safari 26.1, Firefox 150"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and device
      placeholder: "iOS 26.1 on iPhone 15, Windows 11, Ubuntu 24.04"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where are you running it?
      options:
        - "Hosted site"
        - "Docker image"
        - "Local dev server (pnpm dev)"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Open the browser developer tools, reproduce the bug, and paste any red errors. Remove anything private.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I did not attach private images or personal data.
          required: true
